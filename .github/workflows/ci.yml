name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  lint:
    name: ESLint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # package-lock.json is gitignored in this repo, so npm cache cannot be used.

      # Lint only: skip native builds (sonus/snowboy), bower, and apt scripts.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run ESLint
        run: npm test
